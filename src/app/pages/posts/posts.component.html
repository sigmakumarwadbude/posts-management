<section>
  <div class="card">
    <div class="card-header">
        {{pageTitle}}
    </div>
  </div>
  <div class="card-body">
    <div class="row">
        <div class="col-md-2">Filter By:</div>
        <div class="col-md-4">
            <input type="text">
        </div>
    </div>
    <div class="row">
        <div class="col-md-6">
            <h4>Filtered By:</h4>
        </div>
    </div>
    <div class="table-responsive">
        <table class="table">
            <thead>
                <tr>
                    <th>
                        <button class="btn btn-primary">
                            Show Image
                        </button>
                    </th>
                    <th>Name</th>
                    <th>Author</th>
                    <th>Published</th>
                    <th>5 Star Rating</th>
                </tr>
            </thead>
            <tbody>

            </tbody>
        </table>
    </div>
  </div>
</section>
