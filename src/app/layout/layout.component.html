  </div>
</header>

<nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
  <div class="container">
    <div class="navbar-nav">
      <a
        class="nav-item nav-link"
        routerLink="/"
        routerLinkActive="active"

      <a
        class="nav-item nav-link"
        routerLink="/posts"
        routerLinkActive="active"
